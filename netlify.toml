# Netlify build for the N2 Wheels static export.
# The site is statically prerendered by export-netlify.ts into dist-netlify/
# (which is gitignored, so Netlify must build it here).
[build]
  command = "bun install --frozen-lockfile && bun run build && bun ./export-netlify.ts"
  publish = "dist-netlify"

# No Supabase env is required: the site falls back to sample data when
# SUPABASE_URL / SUPABASE_ANON_KEY are absent, so it deploys regardless.
# Add those two under Netlify → Site settings → Environment when going live
# with the real catalogue.

# Git-build path: Netlify reads THIS toml; the generated function lives inside
# the publish directory, so point the functions dir at it explicitly.
[functions]
  directory = "dist-netlify/netlify/functions"

# TanStack Start requires Node >=22.12; pin Bun before dependency installation.
[build.environment]
  NODE_VERSION = "22"
  BUN_VERSION = "1.3.12"
